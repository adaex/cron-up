name: release

# 发布即打版本 tag：测试通过 → 校验 package.json version 与 tag 一致 →
# npm publish。安装与升级都走 npm：npm i -g cron-up。
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: node --test

  publish:
    needs: test
    runs-on: macos-latest
    # trusted publishing：npm 经 GitHub OIDC 验证本 workflow 身份后放行发布，
    # 不再使用长期有效的 NPM_TOKEN。前提（一次性）：npmjs.com 包设置里登记
    # Trusted Publisher = adaex/cron-up + .github/workflows/release.yml。
    permissions:
      contents: read
      id-token: write
    steps:
      # 序号校验要数全部历史 tag：默认浅克隆只带本次触发 tag，不够。
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # trusted publishing 需要 npm ≥ 11.5；显式升级，不受 runner 镜像差异影响。
      - run: npm install -g npm@latest
      - name: Verify package version matches the tag
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "package.json 的版本（$version）与 tag（$GITHUB_REF_NAME）" \
              "不一致：先改版本号再发版" >&2
            exit 1
          fi
      # 版本序号规则：序号 = 含本次在内的历史发布总次数（v* tag 计数）。
      # 数错（该发 21 发成 22）在这里当场拦下，不等到 npm 上出现断号。
      - name: Verify tag serial equals total release count
        run: |
          total=$(git tag -l 'v*' | wc -l | tr -d '[:space:]')
          serial=${GITHUB_REF_NAME#v}
          serial=${serial##*.}
          if [ "$serial" != "$total" ]; then
            echo "tag 序号（$serial）与 v* tag 总数（$total，含本 tag）不一致：" \
              "序号应为发布前 git tag -l 'v*' | wc -l 的结果加一" >&2
            exit 1
          fi
      - name: npm pack dry run (sanity check)
        run: npm pack --dry-run
      - name: Publish to npm
        run: npm publish --provenance
