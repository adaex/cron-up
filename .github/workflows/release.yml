name: release

# 发布即打版本 tag：测试通过 → 校验 package.json version 与 tag 一致 →
# npm publish。安装与升级都走 npm：npm i -g cron-up。
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: node --test

  publish:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Verify package version matches the tag
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "package.json 的版本（$version）与 tag（$GITHUB_REF_NAME）" \
              "不一致：先改版本号再发版" >&2
            exit 1
          fi
      - name: npm pack dry run (sanity check)
        run: npm pack --dry-run
      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
